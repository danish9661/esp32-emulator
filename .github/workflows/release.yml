name: Release

# Publishes the `esp32-emu` npm package and creates a matching GitHub release.
# Trigger by pushing a tag like `v0.1.0`, or run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0). A git tag 'v<version>' is created."
        required: true
      release_notes:
        description: "Release description/notes (optional). Used as the GitHub release body; leave empty to auto-generate from commits."
        required: false
        default: ""

permissions:
  contents: write # needed to create the GitHub release and (on dispatch) the tag
  packages: write # needed to publish to GitHub Packages

jobs:
  build-and-test:
    name: Build WASM engine & test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.version.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (esbuild for dist build)
        # npm ci keeps the lockfile-pinned tree (npm install can drift it);
        # the chmod repairs an esbuild postinstall that lost +x on the
        # binary (spawnSync .../esbuild EACCES on ubuntu-latest runners).
        run: |
          npm ci
          chmod +x node_modules/esbuild/bin/esbuild || true
          node_modules/.bin/esbuild --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM engine (release)
        working-directory: engine-wasm
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Place built wasm into the package
        run: cp engine-wasm/target/wasm32-unknown-unknown/release/esp_engine_wasm.wasm src/engine/esp-xtensa/esp_engine_wasm.wasm

      - name: Build dist bundle (esbuild)
        run: npm run build

      - name: Prepare boot ROM symlink
        # Fresh runners check out WITHOUT the root `rom -> tests/rom`
        # symlink (git tracks it, but Actions' checkout/tar handling drops
        # symlinks on some runners). Recreate it idempotently: -sf works
        # whether or not the link already exists (plain `ln -s` fails if
        # a stale link/file is present and aborts the job under set -e).
        run: ln -sfn tests/rom rom && ls -la rom

      - name: Run no-server tests
        run: |
          set -o pipefail
          FAILED=0
          for t in tests/wasm-bench.mjs tests/test-wasm-standalone.mjs tests/test-wasm-worker-init.mjs tests/test-package-smoke.mjs; do
            echo "--- $t"
            if ENGINE=wasm node "$t" 2>&1 | tee /tmp/test-out.log; then
              echo "PASS $t"
            else
              echo "FAIL $t"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Persist the dispatch-provided release notes (may be empty) via
          # a file: multiline input can't round-trip through outputs cleanly
          # if passed raw, so base64 it. Tag pushes have no input -> empty.
          NOTES_B64="$(printf '%s' "${{ github.event.inputs.release_notes }}" | base64 -w0)"
          echo "release_notes=$NOTES_B64" >> "$GITHUB_OUTPUT"

      - name: Tag repo (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Set package version
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: .

  publish-npm:
    name: Publish to npm
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies & build dist
        working-directory: package
        run: |
          npm ci
          chmod +x node_modules/esbuild/bin/esbuild || true
          npm run build

      - name: Publish
        working-directory: package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github:
    name: Publish to GitHub Packages
    # GitHub Packages rejects unscoped names on the npm registry — the
    # package is published as @danish9661/esp32-emu. setup-node's `scope`
    # only writes .npmrc auth config; the rename below is what actually
    # changes the published name.
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@danish9661'

      - name: Install dependencies & build dist
        working-directory: package
        run: |
          npm ci
          chmod +x node_modules/esbuild/bin/esbuild || true
          npm run build

      - name: Rename for GitHub Packages scope
        working-directory: package
        run: npm pkg set name="@danish9661/esp32-emu"

      - name: Publish
        working-directory: package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: Create GitHub release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package

      - name: Resolve release body
        id: body
        run: |
          # Empty input -> fall back to auto-generated notes. Non-empty
          # input (base64 from build-and-test) becomes the release body.
          B64="${{ needs.build-and-test.outputs.release_notes }}"
          if [ -z "$B64" ]; then
            echo "use_generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_generated=false" >> "$GITHUB_OUTPUT"
            echo "$B64" | base64 -d > /tmp/release-body.md
            # multiline output via heredoc delimiter. Use a unique delimiter
            # (a body line of exactly "EOF" would prematurely close it) and
            # force a newline before the closing marker: if the body does not
            # end in a newline, `cat` + `echo EOF` land on one line and the
            # runner reports "Matching delimiter not found 'EOF'".
            DELIM="RELEASE_BODY_EOF_7f3a9c"
            {
              echo "text<<$DELIM"
              cat /tmp/release-body.md
              echo ""
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create release (custom notes)
        if: steps.body.outputs.use_generated == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-and-test.outputs.version }}
          name: v${{ needs.build-and-test.outputs.version }}
          body: ${{ steps.body.outputs.text }}
          files: package/src/engine/esp-xtensa/esp_engine_wasm.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release (generated notes)
        if: steps.body.outputs.use_generated == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-and-test.outputs.version }}
          name: v${{ needs.build-and-test.outputs.version }}
          files: package/src/engine/esp-xtensa/esp_engine_wasm.wasm
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
