<!doctype html>
<html><head><meta charset="utf-8"><title>jit bench x2</title></head>
<body>
<div id="mips">-</div>
<div id="uart"></div>
<div id="done"></div>
<script type="module">
import { SimulatorWorker } from './worker-proxy.js';
const q = new URLSearchParams(location.search);
const jit = q.get('jit') !== '0';
const $ = (id) => document.getElementById(id);
async function gunzip(gz) {
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([gz]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function launch(tag, romBytes, wasmBytes, raw) {
  const flash = new Uint8Array(new SharedArrayBuffer(4 * 1024 * 1024));
  flash.set(raw);
  const romSab = new SharedArrayBuffer(romBytes.length);
  new Uint8Array(romSab).set(romBytes);
  const wasmSab = new SharedArrayBuffer(wasmBytes.length);
  new Uint8Array(wasmSab).set(wasmBytes);
  const sim = new SimulatorWorker();
  let uart = '';
  sim._onUART = (b) => { uart += String.fromCharCode(b); };
  sim._onError = (e) => { $('uart').textContent += `\n[${tag} ERR] ` + e.message; };
  await sim.init('ESP32', {
    flashSizeMB: 4, mmuPages: 64, strapValue: 0x13, budget: 5000000,
    jitEnabled: jit, jitPage: (new URLSearchParams(location.search).get('tier') === 'page'), bootrom: new Uint8Array(romSab), wasmBinary: new Uint8Array(wasmSab),
  }, flash, null);
  sim.run();
  return { sim, tag, uart: () => uart };
}
try {
  const [romBytes, wasmBytes, gz] = await Promise.all([
    fetch('./esp32-v3-rom.bin').then((r) => r.arrayBuffer()).then((b) => new Uint8Array(b)),
    fetch('./esp_engine_wasm.wasm').then((r) => r.arrayBuffer()).then((b) => new Uint8Array(b)),
    (q.get('fw') === 'speed'
      ? fetch('./fw-speed.bin').then((r) => r.arrayBuffer()).then((b) => ({ gz: new Uint8Array(b), raw: true }))
      : fetch('./fw-gpio.bin.gz').then((r) => r.arrayBuffer()).then((b) => new Uint8Array(b))),
  ]);
  const raw = gz.raw ? gz.gz : await gunzip(gz);
  const A = await launch('A', romBytes, wasmBytes, raw);
  const B = await launch('B', romBytes, wasmBytes, raw);
  const iA0 = A.sim.instTotal ?? 0, iB0 = B.sim.instTotal ?? 0;
  const t0 = performance.now();
  let doneA = 0, doneB = 0, tA = 0, tB = 0, iAend = 0, iBend = 0;
  while (true) {
    await new Promise((r) => setTimeout(r, 200));
    A.sim.pollUart();
    B.sim.pollUart();
    const want = q.get('fw') === 'speed' ? 'SPEEDDONE' : 'ALL TESTS PASSED';
    if (!doneA && A.uart().includes(want)) { doneA = 1; tA = performance.now(); iAend = A.sim.instTotal ?? 0; }
    if (!doneB && B.uart().includes(want)) { doneB = 1; tB = performance.now(); iBend = B.sim.instTotal ?? 0; }
    if (doneA && doneB) break;
    if (performance.now() - t0 > 420000) throw new Error('timeout');
  }
  console.log(`[BENCHX2] A wall=${((tA - t0) / 1000).toFixed(1)}s inst=${iAend - iA0} B wall=${((tB - t0) / 1000).toFixed(1)}s inst=${iBend - iB0}`);
  const wall = (performance.now() - t0) / 1000;
  const iA = (A.sim.instTotal ?? 0) - iA0, iB = (B.sim.instTotal ?? 0) - iB0;
  const mA = iA / wall / 1e6, mB = iB / wall / 1e6;
  $('mips').textContent = (mA + mB).toFixed(1);
  $('uart').textContent = `A=${mA.toFixed(1)} B=${mB.toFixed(1)} total=${(mA + mB).toFixed(1)}`;
  $('done').textContent = 'done jit=' + (jit ? 'on' : 'off');
  try { A.sim.stop(); B.sim.stop(); } catch {}
} catch (e) {
  $('uart').textContent = 'FAILED ' + e.message;
  $('done').textContent = 'error';
}
</script>
</body></html>
