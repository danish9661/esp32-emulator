<!doctype html>
<html><head><meta charset="utf-8"><title>jit bench</title></head>
<body>
<div id="mips">-</div>
<div id="uart"></div>
<div id="done"></div>
<script type="module">
import { SimulatorWorker } from './worker-proxy.js';
const q = new URLSearchParams(location.search);
const jit = q.get('jit') !== '0';
const $ = (id) => document.getElementById(id);
async function gunzip(gz) {
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([gz]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
try {
  const [romBytes, wasmBytes, gz] = await Promise.all([
    fetch('./esp32-v3-rom.bin').then((r) => r.arrayBuffer()).then((b) => new Uint8Array(b)),
    fetch('./esp_engine_wasm.wasm').then((r) => r.arrayBuffer()).then((b) => new Uint8Array(b)),
    (q.get('fw') === 'speed'
      ? fetch('./fw-speed.bin').then((r) => r.arrayBuffer()).then((b) => ({ gz: new Uint8Array(b), raw: true }))
      : fetch('./fw-gpio.bin.gz').then((r) => r.arrayBuffer()).then((b) => new Uint8Array(b))),
  ]);
  const raw = gz.raw ? gz.gz : await gunzip(gz);
  const flash = new Uint8Array(new SharedArrayBuffer(4 * 1024 * 1024));
  flash.set(raw);
  const romSab = new SharedArrayBuffer(romBytes.length);
  new Uint8Array(romSab).set(romBytes);
  const wasmSab = new SharedArrayBuffer(wasmBytes.length);
  new Uint8Array(wasmSab).set(wasmBytes);
  const sim = new SimulatorWorker();
  let uart = '';
  sim._onUART = (b) => { uart += String.fromCharCode(b); };
  sim._onError = (e) => { $('uart').textContent = 'ERR ' + e.message; $('done').textContent = 'error'; };
  await sim.init('ESP32', {
    flashSizeMB: 4, mmuPages: 64, strapValue: 0x13, budget: 5000000,
    jitEnabled: jit, jitPage: q.get('tier') === 'page', jitDryRun: q.get('dry') === '1', jitNoCallout: q.get('noco') === '1', bootrom: new Uint8Array(romSab), wasmBinary: new Uint8Array(wasmSab),
  }, flash, null);
  sim.run();
  if (sim.worker) {
    sim.worker.onerror = (e) => {
      $('uart').textContent += '\n[WORKER-ERR] ' + (e && e.message ? e.message : e);
      $('done').textContent = 'worker-error';
    };
  }
  const inst0 = sim.instTotal ?? 0;
  const t0 = performance.now();
  const expect = q.get('fw') === 'speed' ? 'SPEEDDONE' : 'ALL TESTS PASSED';
  while (true) {
    await new Promise((r) => setTimeout(r, 200));
    sim.pollUart();
    if (uart.includes(expect)) break;
    if (performance.now() - t0 > 420000) throw new Error('timeout; tail=' + uart.slice(-300));
  }
  const wall = (performance.now() - t0) / 1000;
  const inst = (sim.instTotal ?? 0) - inst0;
  const mips = inst / wall / 1e6;
  $('mips').textContent = mips.toFixed(1);
  console.log(`[BENCH] wall=${wall.toFixed(1)}s inst=${inst} inst0=${inst0} instTotal=${sim.instTotal ?? -1}`);
  $('uart').textContent = uart.slice(-500);
  $('done').textContent = 'done jit=' + (jit ? 'on' : 'off');
  try { sim.stop(); } catch {}
} catch (e) {
  $('uart').textContent = 'FAILED ' + e.message;
  $('done').textContent = 'error';
}
</script>
</body></html>
